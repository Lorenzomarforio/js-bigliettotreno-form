<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcola il prezzo del tuo biglietto</title>
    <script src="main.js"  ></script>
</head>
<body>
    <h2>CALCOLA IL PREZZO DEL TUO BIGLIETTO</h2>
    <form action id="ticket-form">
        <div>
            <label >Nome Cognome</label>
            <input type="text" id="nome">
        </div>

        <div>
            <label >Km da percorrere</label>
            <input type="number" id="km">
        </div>

        <div>
            <label >Fascia d'età</label>
            <select id="fasciaeta">
                <option value="minorenne">Minorenne</option>
                <option value="maggiorenne" >Maggiorenne</option>
                <option value="over65">Senior(over-65)</option>
            </select>
        </div>

        <br>

      <button  id ="btnconferma">Conferma</button>
        <button type="button" id="btnannulla">Annulla</button>
    </form>

    <hr>

    <h2>IL TUO BIGLIETTO</h2>

    <h3>Info del passeggero</h3>
    <table border="1" cellpadding="10" cellspacing="2">
        <thead>
            <tr>
                <th>NOME PASSEGGERO</th>
                <th>Offerta</th>
                <th>Carrozza</th>
                <th>Codice CP</th>
                <th>Costo biglietto</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td id="passeggero-nome">-</td>
                <td id="passeggero-offerta">-</td>
                <td id="passeggero-carrozza">-</td>
                <td id="passeggero-codice">-</td>
                <td id="passeggero-costo">-</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
